# Configuration Docker Compose pour orchestrer les services de l'application
# Ce fichier définit les services suivants :
# - Base de données Postrges (pour les données principales)
# - Base de données MongoDB (pour Contact et horaires)
# - Adminer (interface web pour Postrgres)
# - Mongo Express (interface web pour MongoDB)
# - Serveur Node.js (API Express)
# - Frontend React + Vite

services:
  # Service de base de données PostgresSQL
  db:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-root}
      POSTGRES_DB: ${POSTGRES_DB:-vite_gourmand}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Monte tous les scripts SQL (le migration-v001 et le nouveau)
    #  - ./sqlfiles:/docker-entrypoint-initdb.d
    # HEALTHCHECK : Essentiel pour l'orchestration
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5



  mongodb:
    image: mongo:8.0
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root
      MONGO_INITDB_DATABASE: vite_gourmand
    ports:
      - 27017:27017
    volumes:
      - mongodb_data:/data/db
  # Service Adminer : interface web pour gérer la base de données MySQL
  adminer:
    # Image Docker Adminer (outil de gestion de bases de données)
    image: adminer
    # Redémarrage automatique du conteneur en cas d'arrêt
    restart: always
    # Exposition du port 8080 pour accéder à l'interface web
    ports:
      - 8080:8080
  # Service Mongo Express : intreface web pour gérer mongodb
  mongo-express:
    image: mongo-express:latest
    restart: always
    ports:
      - 8081:8081
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: root
      ME_CONFIG_MONGODB_URL: mongodb://root:root@mongodb:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin
    depends_on:
      - mongodb
  # Conteneur d'initialisation de la base de données
  # S'exécute une seule fois pour vérifier et initialiser la base si nécessaire
  db-init:
    image: postgres:17-alpine
    restart: "no" # Ne pas redémarrer automatiquement
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./back/mysql_data:/scripts
    command: >
      sh -c "
        echo '🔍 Vérification de la présence de la table menu...' &&
        
        # Note: On utilise une requête SQL SANS parenthèses pour éviter l'erreur de syntaxe shell
        # Cette requête renvoie '1' si la table existe, et rien sinon.
        CHECK_TABLE=\$$(PGPASSWORD=root psql -h db -d vite_gourmand -U postgres -tAc \"SELECT 1 FROM pg_catalog.pg_tables WHERE tablename = 'menu';\") &&

        if [ \"\$$CHECK_TABLE\" = \"1\" ]; then
          echo '✅ Les tables existent déjà. Initialisation ignorée.'
        else
          echo '📝 Base vide détectée. Lancement des migrations...' &&
          PGPASSWORD=root psql -h db -d vite_gourmand -U postgres -f /scripts/migration-postgresql-v001.sql &&
          PGPASSWORD=root psql -h db -d vite_gourmand -U postgres -f /scripts/data-test-menus-postgresql.sql &&
          PGPASSWORD=root psql -h db -d vite_gourmand -U postgres -f /scripts/data-test-avis-postgresql.sql &&
          PGPASSWORD=root psql -h db -d vite_gourmand -U postgres -f /scripts/migration-add-image-user-postgresql.sql &&
          PGPASSWORD=root psql -h db -d vite_gourmand -U postgres -f /scripts/migration-add-command-id-postgresql.sql &&
          echo '✅ Base de données initialisée avec succès !'
        fi
      "

  # Service serveur Node.js (application Express)
  server:
    # Configuration du build de l'image Docker
    image: node-server
    build:
      context: ./back # Contexte de build : répertoire backend
      dockerfile: node.dockerfile # Fichier Dockerfile à utiliser (relatif au context)
    # Redémarrage automatique du conteneur en cas d'arrêt
    restart: always
    # Dépendances : le serveur attend que les bases de données soient prêtes
    # et que l'initialisation de la base soit terminée
    depends_on:
      db-init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      mongodb:
        condition: service_started
    # Exposition du port 3000 pour accéder à l'API
    ports:
      - 3000:3000
    # Montage de volumes pour le développement
    # Permet de modifier les fichiers sans reconstruire l'image
    volumes:
      - ./back:/app
      - /app/node_modules
    # Variables d'environnement passées au conteneur
    environment:
      - DATABASE_URL=postgresql://postgres:root@db:5432/vite_gourmand
      - DB_TYPE=postgres
      #- DB_HOST=db # Nom du service db (résolu automatiquement par Docker)
      - MONGODB_URI=mongodb://root:root@mongodb:27017/vite_gourmand?authSource=admin # URI de connexion MongoDB
      - JWT_SECRET=rou2KL6nZnKVBo1UVkOoKIpxVzNl85xrFIdzzPj+eRMKlLfvB6jkt6yI3LLJB9q/DK5AoSQKsytxfa3/Ir3oxw== # Clé secrète pour JWT
      # Variables d'environnement pour l'envoi d'email (à configurer selon votre service SMTP)
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=587
      - SMTP_SECURE=false
      - SMTP_USER=slimdev20@gmail.com
      - SMTP_PASSWORD=whhudfyrccrereze
      - SMTP_FROM=slimdev20@gmail.com
      - FRONTEND_URL=http://localhost:5173
      # Variables d'environnement Supabase pour l'upload d'images
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
    # Commande à exécuter au démarrage du conteneur
    command: sh -c "cd /app && npm run dev"
  # Service Frontend React + Vite
  frontend:
    # Configuration du build de l'image Docker
    build:
      context: ./frontend # Contexte de build : répertoire frontend
      dockerfile: Dockerfile # Fichier Dockerfile à utiliser
    # Redémarrage automatique du conteneur en cas d'arrêt
    restart: always
    # Exposition du port 5173 pour accéder à l'application frontend
    ports:
      - 5173:5173
    # Montage de volumes pour le développement
    # Permet de modifier les fichiers sans reconstruire l'image
    volumes:
      - ./frontend:/app
      - /app/node_modules
    # Variables d'environnement passées au conteneur
    environment:
      - VITE_API_URL=http://localhost:3000/api # URL de l'API backend
    # Dépendances : le frontend attend que le serveur backend soit prêt
    depends_on:
      - server

# Volumes nommés pour persister les données
# Ces volumes permettent de conserver les données même après l'arrêt des conteneurs
volumes:
  mongodb_data: # Volume pour les données MongoDB
  postgres_data: # Volume pour les données MySQL (persiste les données entre les redémarrages)